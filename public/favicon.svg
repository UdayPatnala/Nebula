<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Vibrant Nebula Gradients -->
    <linearGradient id="nebula-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" /> <!-- Violet -->
      <stop offset="50%" stop-color="#3b82f6" /> <!-- Blue -->
      <stop offset="100%" stop-color="#0284c7" /> <!-- Sky Blue -->
    </linearGradient>
    <linearGradient id="nebula-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#db2777" stop-opacity="0.8" /> <!-- Rose -->
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0" />
    </linearGradient>
    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Glow -->
  <circle cx="50" cy="50" r="40" fill="url(#nebula-grad-1)" opacity="0.15" filter="url(#glow)" />

  <!-- Outer Swirling Arms -->
  <path d="M50,15 C65,15 80,30 80,50 C80,65 65,80 50,80 C30,80 20,60 20,50 C20,35 35,20 50,20 Z" 
        fill="none" stroke="url(#nebula-grad-1)" stroke-width="4" stroke-dasharray="180 50" stroke-linecap="round" opacity="0.75" />

  <!-- Inner Swirling Arms -->
  <path d="M50,25 C60,25 70,35 70,50 C70,60 60,70 50,70 C35,70 30,55 30,50 C30,40 40,30 50,30 Z" 
        fill="url(#nebula-grad-2)" opacity="0.9" />

  <!-- Glowing Core Star -->
  <path d="M50,38 L53,47 L62,50 L53,53 L50,62 L47,53 L38,50 L47,47 Z" fill="#ffffff" filter="url(#glow)" />
</svg>