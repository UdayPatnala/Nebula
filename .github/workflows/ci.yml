# ──────────────────────────────────────────────────────────────────────────────
# Nebula — CI/CD Pipeline
# Sections 24.6 (CI), 24.7 (Build), 24.8 (Artifacts)
#
# Triggers on every push and pull-request to main / develop.
# Pipeline stages (mirrors Section 24.2 Infrastructure Overview):
#   1. Dependency validation
#   2. Type checking (tsc --noEmit)
#   3. Static analysis (oxlint)
#   4. Unit tests with coverage (vitest)
#   5. Production build (vite build)
#   6. Upload build artifact
# ──────────────────────────────────────────────────────────────────────────────

name: Nebula CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Limit concurrent runs on the same branch (rolling strategy — Section 24.10)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.x'

jobs:
  # ────────────────────────────────────────────────────
  # Job 1: Lint, Type-check, Test, Build
  # ────────────────────────────────────────────────────
  ci:
    name: Lint · Type-check · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # ── 1. Dependency Validation (Section 24.6) ──────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 2. Type Checking (Section 24.6) ──────────────────────────────────
      - name: TypeScript type-check
        run: npx tsc --noEmit

      # ── 3. Static Analysis (Section 24.6) ────────────────────────────────
      - name: Lint (oxlint)
        run: npm run lint
        continue-on-error: true   # Non-blocking in CI for now; tighten post-GA

      # ── 4. Unit Tests with Coverage (Section 23 + 24.6) ──────────────────
      - name: Run unit tests
        run: npm test

      - name: Generate coverage report
        run: npm run test:coverage
        continue-on-error: true   # Coverage upload is informational

      # ── 5. Production Build Verification (Section 24.7) ──────────────────
      - name: Build for production
        run: npm run build
        env:
          NODE_ENV: production

      # ── 6. Upload build artifact (Section 24.8) ──────────────────────────
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: nebula-dist-${{ github.sha }}
          path: dist/
          retention-days: 30

  # ────────────────────────────────────────────────────
  # Job 2: Docker image build & scan (Section 24.9)
  # Only runs on main branch pushes (not PRs)
  # ────────────────────────────────────────────────────
  docker:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false           # Set to true and add registry secrets for production
          tags: nebula:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────────────
  # Job 3: Deploy to Staging (Section 24.10)
  # Only runs after successful ci + docker on main
  # ────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [ci, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging
    timeout-minutes: 10

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: nebula-dist-${{ github.sha }}
          path: dist/

      - name: Deploy to staging environment
        run: |
          echo "Deploying build ${{ github.sha }} to staging..."
          echo "Deployment would push dist/ to CDN / container host here."
          # Placeholder: replace with actual deploy command e.g. firebase deploy, fly deploy etc.

      - name: Health check
        run: |
          echo "Running post-deploy health check against staging URL..."
          # Placeholder: curl --fail https://staging.nebula.app/healthz
